<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" font-family="Liberation Sans, Arial, sans-serif"><rect width="1160" height="540" fill="#fff"/><g transform="translate(60,0)"><text x="130" y="40" font-size="14" text-anchor="start" fill="#111" font-weight="700">Канал A: LED1–LED3 (3 посл., ≈10 В)</text><line x1="70" y1="60" x2="70" y2="170" stroke="#111" stroke-width="2"/><line x1="58" y1="170" x2="82" y2="170" stroke="#111" stroke-width="2"/><line x1="58" y1="180" x2="82" y2="180" stroke="#111" stroke-width="2"/><line x1="70" y1="180" x2="70" y2="330" stroke="#111" stroke-width="2"/><circle cx="70" cy="60" r="4" fill="#111"/><circle cx="70" cy="330" r="4" fill="#111"/><text x="80" y="178" font-size="12" text-anchor="start" fill="#111">Cin</text><line x1="140" y1="60" x2="140" y2="150" stroke="#111" stroke-width="2"/><circle cx="140" cy="60" r="4" fill="#111"/><circle cx="140" cy="105" r="4" fill="#111"/><line x1="140" y1="105" x2="170" y2="105" stroke="#111" stroke-width="2"/><rect x="170" y="97" width="40" height="16" fill="none" stroke="#111" stroke-width="2"/><line x1="210" y1="105" x2="240" y2="105" stroke="#111" stroke-width="2"/><line x1="240" y1="105" x2="240" y2="150" stroke="#111" stroke-width="2"/><circle cx="240" cy="105" r="4" fill="#111"/><text x="190" y="90" font-size="12" text-anchor="middle" fill="#111">Rs 0,15</text><rect x="120" y="150" width="140" height="100" fill="#f3f6fb" stroke="#111" stroke-width="2"/><text x="190" y="205" font-size="15" text-anchor="middle" fill="#111" font-weight="700">PT4115</text><text x="190" y="223" font-size="12" text-anchor="middle" fill="#111">U</text><text x="144" y="168" font-size="11" text-anchor="start" fill="#111">VIN</text><text x="222" y="168" font-size="11" text-anchor="start" fill="#111">CSN</text><text x="256" y="219" font-size="11" text-anchor="end" fill="#111">SW</text><text x="190" y="244" font-size="11" text-anchor="middle" fill="#111">GND</text><text x="124" y="204" font-size="11" text-anchor="start" fill="#111">DIM</text><line x1="100" y1="200" x2="120" y2="200" stroke="#111" stroke-width="2"/><circle cx="97" cy="200" r="3" fill="#fff" stroke="#111" stroke-width="1.5"/><line x1="190" y1="250" x2="190" y2="330" stroke="#111" stroke-width="2"/><circle cx="190" cy="330" r="4" fill="#111"/><line x1="240" y1="105" x2="340" y2="105" stroke="#111" stroke-width="2"/><line x1="340" y1="105" x2="340" y2="215" stroke="#111" stroke-width="2"/><polygon points="330,120 350,120 340,138" fill="#fff" stroke="#111" stroke-width="2"/><line x1="330" y1="138" x2="350" y2="138" stroke="#111" stroke-width="2"/><line x1="360" y1="122" x2="372" y2="114" stroke="#d98a00" stroke-width="2"/><text x="358" y="142" font-size="12" text-anchor="start" fill="#111">LED1</text><polygon points="330,150 350,150 340,168" fill="#fff" stroke="#111" stroke-width="2"/><line x1="330" y1="168" x2="350" y2="168" stroke="#111" stroke-width="2"/><line x1="360" y1="152" x2="372" y2="144" stroke="#d98a00" stroke-width="2"/><text x="358" y="172" font-size="12" text-anchor="start" fill="#111">LED2</text><polygon points="330,180 350,180 340,198" fill="#fff" stroke="#111" stroke-width="2"/><line x1="330" y1="198" x2="350" y2="198" stroke="#111" stroke-width="2"/><line x1="360" y1="182" x2="372" y2="174" stroke="#d98a00" stroke-width="2"/><text x="358" y="202" font-size="12" text-anchor="start" fill="#111">LED3</text><line x1="340" y1="215" x2="324" y2="215" stroke="#111" stroke-width="2"/><path d="M 324,215 a6,6 0 0 0 -12,0 a6,6 0 0 0 -12,0 a6,6 0 0 0 -12,0" fill="none" stroke="#111" stroke-width="2"/><line x1="288" y1="215" x2="260" y2="215" stroke="#111" stroke-width="2"/><circle cx="270" cy="215" r="4" fill="#111"/><text x="312" y="242" font-size="13" text-anchor="middle" fill="#111">L</text><line x1="270" y1="215" x2="270" y2="285" stroke="#111" stroke-width="2"/><line x1="270" y1="285" x2="420" y2="285" stroke="#111" stroke-width="2"/><line x1="420" y1="285" x2="420" y2="200" stroke="#111" stroke-width="2"/><polygon points="410,200 430,200 420,182" fill="#fff" stroke="#111" stroke-width="2"/><line x1="410" y1="182" x2="430" y2="182" stroke="#111" stroke-width="2"/><line x1="420" y1="182" x2="420" y2="60" stroke="#111" stroke-width="2"/><circle cx="420" cy="60" r="4" fill="#111"/><text x="434" y="195" font-size="12" text-anchor="start" fill="#111">D (Шоттки)</text><text x="670" y="40" font-size="14" text-anchor="start" fill="#111" font-weight="700">Канал B: LED4–LED5 (2 посл., ≈6,6 В)</text><line x1="610" y1="60" x2="610" y2="170" stroke="#111" stroke-width="2"/><line x1="598" y1="170" x2="622" y2="170" stroke="#111" stroke-width="2"/><line x1="598" y1="180" x2="622" y2="180" stroke="#111" stroke-width="2"/><line x1="610" y1="180" x2="610" y2="330" stroke="#111" stroke-width="2"/><circle cx="610" cy="60" r="4" fill="#111"/><circle cx="610" cy="330" r="4" fill="#111"/><text x="620" y="178" font-size="12" text-anchor="start" fill="#111">Cin</text><line x1="680" y1="60" x2="680" y2="150" stroke="#111" stroke-width="2"/><circle cx="680" cy="60" r="4" fill="#111"/><circle cx="680" cy="105" r="4" fill="#111"/><line x1="680" y1="105" x2="710" y2="105" stroke="#111" stroke-width="2"/><rect x="710" y="97" width="40" height="16" fill="none" stroke="#111" stroke-width="2"/><line x1="750" y1="105" x2="780" y2="105" stroke="#111" stroke-width="2"/><line x1="780" y1="105" x2="780" y2="150" stroke="#111" stroke-width="2"/><circle cx="780" cy="105" r="4" fill="#111"/><text x="730" y="90" font-size="12" text-anchor="middle" fill="#111">Rs 0,15</text><rect x="660" y="150" width="140" height="100" fill="#f3f6fb" stroke="#111" stroke-width="2"/><text x="730" y="205" font-size="15" text-anchor="middle" fill="#111" font-weight="700">PT4115</text><text x="730" y="223" font-size="12" text-anchor="middle" fill="#111">U</text><text x="684" y="168" font-size="11" text-anchor="start" fill="#111">VIN</text><text x="762" y="168" font-size="11" text-anchor="start" fill="#111">CSN</text><text x="796" y="219" font-size="11" text-anchor="end" fill="#111">SW</text><text x="730" y="244" font-size="11" text-anchor="middle" fill="#111">GND</text><text x="664" y="204" font-size="11" text-anchor="start" fill="#111">DIM</text><line x1="640" y1="200" x2="660" y2="200" stroke="#111" stroke-width="2"/><circle cx="637" cy="200" r="3" fill="#fff" stroke="#111" stroke-width="1.5"/><line x1="730" y1="250" x2="730" y2="330" stroke="#111" stroke-width="2"/><circle cx="730" cy="330" r="4" fill="#111"/><line x1="780" y1="105" x2="880" y2="105" stroke="#111" stroke-width="2"/><line x1="880" y1="105" x2="880" y2="215" stroke="#111" stroke-width="2"/><polygon points="870,120 890,120 880,138" fill="#fff" stroke="#111" stroke-width="2"/><line x1="870" y1="138" x2="890" y2="138" stroke="#111" stroke-width="2"/><line x1="900" y1="122" x2="912" y2="114" stroke="#d98a00" stroke-width="2"/><text x="898" y="142" font-size="12" text-anchor="start" fill="#111">LED4</text><polygon points="870,150 890,150 880,168" fill="#fff" stroke="#111" stroke-width="2"/><line x1="870" y1="168" x2="890" y2="168" stroke="#111" stroke-width="2"/><line x1="900" y1="152" x2="912" y2="144" stroke="#d98a00" stroke-width="2"/><text x="898" y="172" font-size="12" text-anchor="start" fill="#111">LED5</text><line x1="880" y1="215" x2="864" y2="215" stroke="#111" stroke-width="2"/><path d="M 864,215 a6,6 0 0 0 -12,0 a6,6 0 0 0 -12,0 a6,6 0 0 0 -12,0" fill="none" stroke="#111" stroke-width="2"/><line x1="828" y1="215" x2="800" y2="215" stroke="#111" stroke-width="2"/><circle cx="810" cy="215" r="4" fill="#111"/><text x="852" y="242" font-size="13" text-anchor="middle" fill="#111">L</text><line x1="810" y1="215" x2="810" y2="285" stroke="#111" stroke-width="2"/><line x1="810" y1="285" x2="960" y2="285" stroke="#111" stroke-width="2"/><line x1="960" y1="285" x2="960" y2="200" stroke="#111" stroke-width="2"/><polygon points="950,200 970,200 960,182" fill="#fff" stroke="#111" stroke-width="2"/><line x1="950" y1="182" x2="970" y2="182" stroke="#111" stroke-width="2"/><line x1="960" y1="182" x2="960" y2="60" stroke="#111" stroke-width="2"/><circle cx="960" cy="60" r="4" fill="#111"/><text x="974" y="195" font-size="12" text-anchor="start" fill="#111">D (Шоттки)</text><line x1="30" y1="60" x2="960" y2="60" stroke="#111" stroke-width="2"/><line x1="30" y1="330" x2="740" y2="330" stroke="#111" stroke-width="2"/><circle cx="30" cy="60" r="5" fill="#fff" stroke="#111" stroke-width="2"/><text x="24" y="65" font-size="14" text-anchor="end" fill="#111" font-weight="700">+12 В</text><circle cx="30" cy="330" r="5" fill="#fff" stroke="#111" stroke-width="2"/><text x="24" y="335" font-size="14" text-anchor="end" fill="#111" font-weight="700">GND</text><text x="30" y="22" font-size="19" text-anchor="start" fill="#111" font-weight="700">Светильник: 5× OSRAM OSLON, питание 12 В DC</text><text x="30" y="385" font-size="13" text-anchor="start" fill="#111">Почему так: 5 LED по ≈3,3 В в одну цепочку = 16,5 В > 12 В; резистор на каждый LED греет ≈30 Вт. Две цепочки (3+2) с драйвером тока — КПД ≈90%.</text><text x="30" y="409" font-size="13" text-anchor="start" fill="#111">Ток: Rs = 0,1 В / I → Rs = 0,15 Ом ⇒ ≈667 мА (цель 700 мА). LED ≈2,3 Вт каждый, всего ≈11,5 Вт; от 12 В потребление ≈1,1 А.</text><text x="30" y="433" font-size="13" text-anchor="start" fill="#111">Внимание: цепочка A ≈10 В от 12 В — запас мал. Питание держать 12–13,8 В и проверить на макете; запасной вариант — каналы 2+2+1.</text><text x="30" y="457" font-size="13" text-anchor="start" fill="#111">Перечень: LED1–5 OSRAM OSLON белый (≈3,2–3,4 В @700 мА); U ×2 PT4115 (до 1,2 А); Rs ×2 0,15 Ом 1% 1206; L ×2 33–47 мкГн (Isat ≥ 1,5 А);</text><text x="30" y="481" font-size="13" text-anchor="start" fill="#111">D ×2 SS24/SS34 (2–3 А, 40 В); Cin ×2 10 мкФ 25–50 В X7R + 220 мкФ 25 В на входе; DIM — NC (100%) или ШИМ. Плата — алюминиевая (MCPCB) на радиатор.</text><text x="30" y="505" font-size="13" text-anchor="start" fill="#111">Значения подобраны по памяти: тип OSLON, Vf, параметры PT4115 и номиналы L/D сверьте с даташитами и расчётом.</text></g></svg>